<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     

        .con{
            height: 600px;
            border: 1px solid black;
        
        }
        .header{
            height: 150px;
            border: 1px solid black;
            background-color: rgb(29, 29, 146);
        }
        .footer{
            height: 150px;
            border: 1px solid black;
            background-color: rebeccapurple;
        }
        .center{
            height: 300px;
            border: 1px solid black;
            display: flex;
        }
        .left{
            height: 100%; 
            width: 25%;
            border: 1px solid black;
            background-color: rgb(189, 16, 117);
        }
        .right{
            height: 100%;
            width: 75%;
            background-color: blueviolet;
        }
        .top{
            height: 50%;
            width: 100%;
            background-color:cornflowerblue;
        }
        .bottom{
            display: flex;
            height: 50%;
            width: 100%;
        }
        .b1{
            height: 100%;
            width: 50%;
            background-color: slateblue;
        }
        .b2{
            height: 100%;
            width: 50%;
            background-color: gray;
        }
        h1{
            text-align: center;
        }


    </style>
</head>
<body>
    
        
    <big> <H1> Flex Box</H1></big>
    <div class="con">
        <div class="header"></div>
        <div class="center">
            <div class="left"></div>
            <div class="right">
                <div class="top"></div>
                <div class="bottom">
                    <div class="b1"></div>
                    <div class="b2"></div>
                </div>
            </div>
        </div>
        <div class="footer"></div>
    </div>
</body>
</html>
